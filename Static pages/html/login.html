<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - College Assist</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
    <div class="px-8 pt-8 pb-6 text-center">
      <a href="index.html" class="inline-flex items-center justify-center h-12 w-12 rounded-xl bg-orange-500 mb-6 shadow-md">
        <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </a>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Welcome to College Assist</h1>
      <p class="text-sm text-slate-500 mt-2">Sign in to organize your academic life and start syncing tasks to your calendar.</p>
    </div>
    <div class="px-8 pb-8 space-y-6">
      <a href="dashboard.html" class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-orange-500/30">
        <svg class="h-5 w-5" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>
      <div class="relative flex items-center justify-center text-sm">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <span class="relative bg-white px-4 text-slate-500 font-medium text-xs uppercase tracking-widest">Or continue with email</span>
      </div>
      <form class="space-y-4" action="dashboard.html">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-900 mb-1">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 placeholder-slate-400 focus:border-orange-500 focus:outline-none focus:ring-1 focus:ring-orange-500 sm:text-sm" placeholder="you@university.edu" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-900 mb-1">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 placeholder-slate-400 focus:border-orange-500 focus:outline-none focus:ring-1 focus:ring-orange-500 sm:text-sm" placeholder="••••••••" />
        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-orange-500 focus:ring-orange-500">
            <label for="remember-me" class="ml-2 block text-sm text-slate-700">Remember me</label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-medium text-orange-600 hover:text-orange-500">Forgot password?</a>
          </div>
        </div>
        <button type="submit" class="w-full flex justify-center rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2">
          Sign In
        </button>
      </form>
    </div>
    <div class="bg-slate-50 px-8 py-6 text-center border-t border-slate-200">
      <p class="text-sm text-slate-600">
        Don't have an account?
        <a href="#" class="font-semibold text-orange-600 hover:text-orange-500 transition-colors">Sign up for free</a>
      </p>
    </div>
  </div>
  <div class="mt-8 text-center text-sm text-slate-500">
    <a href="index.html" class="hover:text-slate-900 transition-colors">&larr; Back to home</a>
  </div>
</body>
</html>
